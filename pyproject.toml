[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judgedee"
version = "2.5.0"
description = "JudgeDee（狄仁杰）：本地人物情报工作台 —— 用户名检索、身份拼图、IP 与手机号归属地，全部离线"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "L71615" }]
keywords = ["osint", "username", "identity-graph", "desktop", "tkinter", "windows"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
export = ["pandas>=2.0", "openpyxl>=3.1"]
profile = ["pillow>=10.0"]
phone = ["phonenumbers>=8.13"]
all = ["pandas>=2.0", "openpyxl>=3.1", "pillow>=10.0", "phonenumbers>=8.13"]
build = ["pyinstaller>=6.0"]

[project.scripts]
judgedee = "judgedee.__main__:main"

[project.gui-scripts]
judgedee-gui = "judgedee.__main__:main"

[tool.setuptools]
packages = ["judgedee", "judgedee.ui"]

[tool.setuptools.package-data]
judgedee = ["assets/*", "data/*.json"]
