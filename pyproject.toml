[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holmes-desk"
version = "0.2.0"
description = "HolmesDesk 路 鏈湴鐢ㄦ埛鍚嶆绱㈠伐鍏凤紙Windows 妗岄潰鐗堬紝鍗曚緷璧栥€佸彲绂荤嚎銆佺粨鏋滃鍑轰簲绉嶆牸寮忥級"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "L71615" }]
keywords = ["osint", "username", "sherlock", "desktop", "tkinter", "windows"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
export = ["pandas>=2.0", "openpyxl>=3.1"]
build = ["pyinstaller>=6.0"]

[project.scripts]
holmes-desk = "holmes_desk.__main__:main"

[project.gui-scripts]
holmes-desk-gui = "holmes_desk.__main__:main"

[tool.setuptools]
packages = ["holmes_desk", "holmes_desk.ui"]

[tool.setuptools.package-data]
holmes_desk = ["assets/*", "data/*.json"]
